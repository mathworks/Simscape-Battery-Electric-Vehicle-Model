name: Test R2024b branch on Windows

on:
  push:
    branches: [ R2024b ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '**.png'
      - '**.svg'
      - '**.txt'
      - '**.xml'

  pull_request:
    branches: [ R2024b ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '**.png'
      - '**.svg'
      - '**.txt'
      - '**.xml'

  workflow_dispatch:

jobs:

  job-buildtool:

    runs-on: windows-latest

    strategy:
      matrix:
        matlab_release: [R2024b, latest]

    name: Test R2024b branch using MATLAB ${{ matrix.matlab_release }} on Windows

    steps:

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup MATLAB ${{ matrix.matlab_release }}
        uses: matlab-actions/setup-matlab@v2
        with:
          release: ${{ matrix.matlab_release }}
          cache: true
          products: |
            Simulink
            Simscape
            Simscape_Electrical
            Simscape_Driveline
            Powertrain_Blockset

      - name: Run tests
        uses: matlab-actions/run-command@v2
        with:
          command: |
            openProject(pwd);
            buildtool -buildFile buildfile_24b.m -verbosity Verbose CodeIssues CheckProject Test
